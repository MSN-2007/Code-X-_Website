<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #0a0a0a; }
      .text-bracket { fill: #ffffff; }
      .text-x { fill: #d20000; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0a0a0a; }
      .text-bracket { fill: #ffffff; }
      .text-x { fill: #ff3333; }
    }
  </style>
  <rect width="100" height="100" rx="20" class="bg" />
  <rect x="5" y="5" width="90" height="90" rx="16" fill="none" stroke="#d20000" stroke-width="3" opacity="0.6" />
  <text x="50" y="68" font-family="'Space Grotesk', 'Courier New', monospace" font-size="52" font-weight="800" text-anchor="middle">
    <tspan class="text-bracket">{</tspan><tspan class="text-x">X</tspan><tspan class="text-bracket">}</tspan>
  </text>
</svg>

